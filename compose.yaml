services:
  zhixue:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
      ZHIXUE_DATA_DIR: /var/data
      ZHIXUE_COOKIE_SECURE: 0
      ZHIXUE_TRUST_PROXY: 0
      ZHIXUE_SANDBOX_TTL_HOURS: 24
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - zhixue-runtime:/var/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  zhixue-runtime:
