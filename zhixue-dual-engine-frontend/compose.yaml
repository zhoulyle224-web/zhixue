services:
  zhixue:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      NODE_ENV: production
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - zhixue-runtime:/app/data/runtime
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  zhixue-runtime:
