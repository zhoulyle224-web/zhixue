services:
  - type: web
    name: zhixue-dual-engine
    runtime: docker
    repo: https://github.com/zhoulyle224-web/zhixue.git
    branch: main
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ZHIXUE_DATA_DIR
        value: /var/data
      - key: ZHIXUE_COOKIE_SECURE
        value: "1"
      - key: ZHIXUE_TRUST_PROXY
        value: "1"
      - key: ZHIXUE_SANDBOX_TTL_HOURS
        value: "24"
      - key: ZHIXUE_SANDBOX_IDLE_MINUTES
        value: "15"
      - key: ZHIXUE_MAX_SANDBOXES
        value: "1000"
    disk:
      name: zhixue-sandbox-data
      mountPath: /var/data
      sizeGB: 1
