apiVersion: zhixue.openclaw/v1
kind: AgentBundle
metadata:
  name: 智学双擎-课后答疑与学情研判
  version: 2026.09.14
  owner: 院校教学创新中心

defaults:
  model:
    provider: ollama
    name: qwen2.5:7b-instruct
    timeout_seconds: 20
    fallback: local-rule-skill
  data_policy:
    network: disabled-by-default
    logs: masked
    human_confirmation: required-for-high-impact-actions

memory:
  scopes:
    - id: course_knowledge
      type: vector_and_metadata
      retention: course_term
      access: teacher,student,admin
    - id: qa_history
      type: relational
      retention: one_year
      access: teacher,student
      masking: [name,student_no,phone,email]
    - id: class_profile
      type: sqlite_read_model
      retention: current_term
      access: teacher,admin
      source: data/zhixue_demo.sqlite
    - id: decision_log
      type: append_only
      retention: three_years
      access: admin

tools:
  - id: sqlite-readonly
    type: database
    target: data/zhixue_demo.sqlite
    permissions: [read]
    timeout_seconds: 5
    failure_policy: use_cached_snapshot

  - id: academic-performance-analyzer
    type: skill
    entry: assets/skills/academic-performance-analyzer.js
    permissions: [aggregate_learning_data]
    input_schema: scores,knowledge_points,exam_name,class_name
    output_schema: overall_summary,knowledge_analysis,student_stratification,teaching_suggestions
    human_confirmation: true

  - id: course-ai-tutor
    type: skill
    entry: assets/skills/course-ai-tutor.js
    permissions: [read_course_knowledge]
    input_schema: student_question,course_name,knowledge_base,question_context,student_level
    output_schema: answer_status,answer_content,related_knowledge,guide_questions
    failure_policy: handoff_to_teacher

  - id: teacher-answer-manager
    type: skill
    entry: assets/skills/teacher-answer-manager.js
    permissions: [aggregate_qa]
    input_schema: course_name,questions,existing_faq
    output_schema: aggregate,unified_answers,faq_updates,remedial_targets,summary
    human_confirmation: true

  - id: controlled-export
    type: service
    endpoint: /api/export
    permissions: [redact,watermark,audit]
    allowed_formats: [csv,excel,print,json]

agents:
  - id: zhixue-orchestrator
    label: 主智能体
    mode: router
    instructions: |
      你负责识别教师或学生的真实目标，选择最小必要 Skill 并按工作流编排。
      你不直接修改成绩、不直接发布任务、不向学生暴露班级排名或教师内部备注。
      资料不足时转人工，模型异常时使用本地规则 Skill。
    skills: [academic-performance-analyzer,course-ai-tutor,teacher-answer-manager]
    tools: [sqlite-readonly,controlled-export]
    handoff:
      low_confidence: human-teacher
      permission_denied: security-admin

  - id: learning-analyst
    label: 学情研判子智能体
    mode: worker
    instructions: |
      依据匿名的成绩、作业、互动与知识点快照生成班级画像。
      每个结论必须给出数据依据、样本量和统计口径。
      把“建议”与“事实”分开，禁止推断家庭、心理、经济等敏感属性。
    skills: [academic-performance-analyzer]
    tools: [sqlite-readonly]

  - id: course-tutor
    label: 课后答疑子智能体
    mode: worker
    instructions: |
      只使用当前课程知识库回答，先给结论，再给思路和依据。
      引用必须定位到讲义、课件或例题。检索为空时不得猜答。
      检测到提问越权、个人隐私或无关内容时按拒答规则处理。
    skills: [course-ai-tutor]
    tools: []

  - id: answer-manager
    label: 教师答疑管理子智能体
    mode: worker
    instructions: |
      聚合高频问题、生成统一答复草案并识别需要重点辅导的学习主题。
      所有班级级回复和辅导名单必须经教师确认后发布。
    skills: [teacher-answer-manager]
    tools: []

workflows:
  - id: after_class_loop
    label: 课后即时答疑与学情研判闭环
    trigger: student_question,teacher_analysis,new_assessment_import
    steps:
      - id: authority_check
        tool: policy-engine
        on_failure: deny_and_audit
      - id: privacy_filter
        tool: redaction-engine
        on_failure: stop
      - id: route
        agent: zhixue-orchestrator
        outcomes: [tutor_path,analyst_path,review_path]
      - id: tutor_path
        when: intent == "course_question"
        agent: course-tutor
        skill: course-ai-tutor
        on_empty: create_teacher_ticket
      - id: analyst_path
        when: intent == "learning_analysis"
        agent: learning-analyst
        skill: academic-performance-analyzer
        before_execute: teacher_confirmation
      - id: review_path
        when: intent == "qa_review"
        agent: answer-manager
        skill: teacher-answer-manager
        before_publish: teacher_confirmation
      - id: evidence_write
        tool: audit-log
        required_fields: [actor_role,action,object_ref,result,timestamp]
      - id: export
        when: teacher_requests_export
        tool: controlled-export
        before_execute: [permission_check,redaction,watermark]

guardrails:
  input:
    - block: prompt_injection
      action: refuse_and_audit
    - redact: pii
      action: replace_then_continue
    - limit:
        question_chars: 500
        upload_mb: 10
  reasoning:
    - require_citations_for_answers
    - prohibit_sensitive_attribute_inference
    - mark_uncertainty_and_sample_size
  output:
    - min_confidence_for_auto_answer: 0.72
    - require_teacher_confirmation_for:
        - task_publish
        - student_risk_label
        - course_content_revision
        - class_level_export
    - watermark_exports: true
  failure:
    model_timeout: local_rule_skill
    model_unavailable: template_response
    database_unavailable: cached_snapshot
    tool_failure: queue_and_retry_then_handoff
