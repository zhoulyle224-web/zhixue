<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="智学双擎模拟登录：选择教师或学生身份进入对应工作台">
  <title>登录工作台｜智学双擎</title><link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/concept.css">
</head>
<body data-page="login" class="login-page concept-login">
  <canvas id="particles"></canvas><div class="orb one"></div><div class="orb two"></div>
  <nav class="topnav login-nav"><a class="brand concept-brand" href="index.html"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></span><span>智学双擎<small>ZHIXUE DUAL ENGINE</small></span></a><a class="back-home" href="index.html">← 返回平台首页</a></nav>
  <main class="login-shell">
    <section class="login-story">
      <span class="tag"><i class="pulse"></i> 服务端演示身份登录</span>
      <h1>同一条学习链路<br><span class="gradient">两种专属工作台</span></h1>
      <p>教师围绕课程和班级研判学情，学生围绕个人画像完成个性化学习。选择身份后进入对应空间。</p>
      <div class="login-flow">
        <div><b>教师端</b><span>建课分班 · 数据质检 · 学情分析 · 任务发布</span></div>
        <i>⇄</i>
        <div><b>学生端</b><span>加入课程 · 个人画像 · 有据答疑 · 学习反馈</span></div>
      </div>
      <div class="demo-safe"><span>◎</span><p><b>服务端会话保护</b><small>演示账号由本地服务校验，浏览器通过 HttpOnly Cookie 维持会话。</small></p></div>
    </section>
    <section class="login-card card">
      <div class="login-heading"><span class="login-mark">✦</span><div><h2>登录智学双擎</h2><p>请选择你的使用身份</p></div></div>
      <div class="role-tabs" role="tablist" aria-label="登录身份">
        <button class="role-tab on" data-login-role="teacher" role="tab"><span>教</span><div><b>教师</b><small>进入学情工作台</small></div></button>
        <button class="role-tab" data-login-role="student" role="tab"><span>学</span><div><b>学生</b><small>进入学习空间</small></div></button>
      </div>
      <form id="loginForm" novalidate>
        <label class="login-field"><span>演示账号</span><div><i>◇</i><input id="loginAccount" autocomplete="username" placeholder="请输入演示账号"></div></label>
        <label class="login-field"><span>演示密码</span><div><i>○</i><input id="loginPassword" type="password" autocomplete="current-password" placeholder="请输入演示密码"><button type="button" id="togglePassword" aria-label="显示或隐藏密码">显示</button></div></label>
        <div class="login-options"><label><input id="rememberLogin" type="checkbox" checked> 在当前设备保持登录</label><button type="button" id="fillDemo">填入演示账号</button></div>
        <div class="login-error" id="loginError" role="alert"></div>
        <button class="btn primary login-submit" type="submit"><span>登录并进入教师端</span><i>→</i></button>
      </form>
      <div class="demo-accounts expanded">
        <div class="demo-title"><span>可用演示账号</span><small>点击账号可直接填入</small></div>
        <button type="button" data-demo-account="teacher"><i>教</i><span><b>教师账号</b><code>teacher2026　/　demo123</code><small>仅进入教师端；切换身份需重新登录</small></span></button>
        <button type="button" data-demo-account="student"><i>学</i><span><b>学生账号</b><code>student2026　/　demo123</code><small>仅允许进入学生端</small></span></button>
        <p id="demoCredential" hidden></p>
      </div>
      <p class="login-note">本项目使用合成演示账号；身份、角色和数据范围均由服务端校验，不接入真实学校统一身份。</p>
    </section>
  </main>
  <div class="toast"></div><script src="assets/api-client.js"></script><script src="assets/app.js"></script><script src="assets/concept-motion.js"></script>
</body>
</html>
